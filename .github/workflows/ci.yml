name: ReconPilot CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting and lint with Ruff
        run: |
          python -m ruff check server
          python -m ruff format server --check

      - name: Run Pytest test suite
        run: |
          python -m pytest server/tests

  frontend-quality:
    name: Frontend Lint, Type Check, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Type check with TypeScript
        working-directory: client
        run: npx tsc --noEmit

      - name: Build frontend production bundle
        working-directory: client
        run: npm run build
